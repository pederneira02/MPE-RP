<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hub do Ministério Público - MPE RP</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <img src="logo.png" alt="Logo MP">
      <h2>SISTEMA JURÍDICO<br><span>Hub de Ferramentas - MPE</span></h2>
    </div>

    <!-- SELETOR DE FERRAMENTAS DO MP -->
    <div class="tool-selector">
      <label for="select-ferramenta">SELECIONE A FERRAMENTA:</label>
      <select id="select-ferramenta" onchange="mudarFerramenta()">
        <option value="controle">Controle Externo da Atividade Policial</option>
        <option value="anpp" selected>Acordo de Não Persecução Penal (ANPP)</option>
        <option value="denuncia">Denúncia Criminal (Deferir/Indeferir)</option>
        <option value="requisicao">Requisição Ministerial</option>
        <option value="promocao">Promoção Ministerial</option>
        <option value="arquivamento">Promoção de Arquivamento</option>
        <option value="manifestacao">Manifestação Ministerial</option>
        <option value="parecer">Parecer Jurídico</option>
        <option value="oficio">Ofício do MP</option>
      </select>
    </div>

    <div class="sidebar-content">
      
      <!-- FORMULÁRIO 1: CONTROLE EXTERNO -->
      <div id="form-controle" class="form-container hidden">
        <div class="form-section">
          <h3>Informações Gerais</h3>
          <div class="input-row">
            <div class="input-group">
              <label>Nº Relatório</label>
              <input type="text" id="ctrl-num" placeholder="015" oninput="updateDoc()">
            </div>
            <div class="input-group">
              <label>Ano</label>
              <input type="text" id="ctrl-ano" value="2026" oninput="updateDoc()">
            </div>
          </div>
          <div class="input-group">
            <label>Departamento</label>
            <select id="ctrl-dp" onchange="updateDoc()">
              <option value="Polícia Civil">Polícia Civil</option>
              <option value="Polícia Militar">Polícia Militar</option>
              <option value="Polícia Federal">Polícia Federal</option>
              <option value="BOPE">BOPE</option>
            </select>
          </div>
          <div class="input-group">
            <label>Promotor(a)</label>
            <input type="text" id="ctrl-promotor" placeholder="Nome do Promotor" oninput="updateDoc()">
          </div>
        </div>
      </div>

      <!-- FORMULÁRIO 2: ANPP -->
      <div id="form-anpp" class="form-container">
        <div class="form-section">
          <h3>1. Qualificação das Partes</h3>
          <div class="input-group">
            <label>Promotor(a) de Justiça</label>
            <input type="text" id="anpp-promotor" placeholder="Ex: Dr. Marco Antonio" oninput="updateDoc()">
          </div>
          <div class="input-row">
            <div class="input-group">
              <label>Investigado(a) (Réu)</label>
              <input type="text" id="anpp-reu" placeholder="Nome do Réu" oninput="updateDoc()">
            </div>
            <div class="input-group">
              <label>Passaporte (ID)</label>
              <input type="text" id="anpp-passaporte" placeholder="1234" oninput="updateDoc()">
            </div>
          </div>
          <div class="input-row">
            <div class="input-group">
              <label>Advogado(a) de Defesa</label>
              <input type="text" id="anpp-advogado" placeholder="Nome do Advogado" oninput="updateDoc()">
            </div>
            <div class="input-group">
              <label>OAB Nº</label>
              <input type="text" id="anpp-oab" placeholder="OAB-123" oninput="updateDoc()">
            </div>
          </div>
          <div class="input-group">
            <label>Procedimento / IP ou BO Nº</label>
            <input type="text" id="anpp-proc" placeholder="IP Nº 045/2026" oninput="updateDoc()">
          </div>
        </div>

        <div class="form-section">
          <h3>2. Condições do Acordo</h3>
          <div class="input-group">
            <label><input type="checkbox" id="chk-dano" onchange="updateDoc()"> Reparação do Dano</label>
            <input type="text" id="anpp-dano-val" placeholder="Valor (R$) ou Bem" oninput="updateDoc()">
            <input type="text" id="anpp-vitima" placeholder="Nome da Vítima" oninput="updateDoc()">
          </div>
          <br>
          <div class="input-group">
            <label><input type="checkbox" id="chk-pecuniaria" onchange="updateDoc()"> Prestação Pecuniária</label>
            <input type="text" id="anpp-pec-val" placeholder="Valor (R$)" oninput="updateDoc()">
            <input type="text" id="anpp-pec-dest" placeholder="Fundo/Instituição Destino" oninput="updateDoc()">
          </div>
          <br>
          <div class="input-group">
            <label><input type="checkbox" id="chk-servico" onchange="updateDoc()"> Prestação de Serviços</label>
            <input type="text" id="anpp-serv-horas" placeholder="Qtd. Horas" oninput="updateDoc()">
            <input type="text" id="anpp-serv-local" placeholder="Local (Ex: Hospital)" oninput="updateDoc()">
          </div>
          <br>
          <div class="input-group">
            <label><input type="checkbox" id="chk-outros" onchange="updateDoc()"> Condições Adicionais</label>
            <textarea id="anpp-outros-text" rows="2" placeholder="Ex: Proibição de frequentar locais..." oninput="updateDoc()"></textarea>
          </div>
        </div>

        <div class="form-section">
          <h3>3. Assinatura Judicial</h3>
          <div class="input-group">
            <label>Juiz(a) das Garantias</label>
            <input type="text" id="anpp-juiz" placeholder="Nome do Juiz" oninput="updateDoc()">
          </div>
        </div>
      </div>

      <!-- FORMULÁRIO 3: DENÚNCIA CRIMINAL -->
      <div id="form-denuncia" class="form-container hidden">
        <div class="form-section">
          <h3>Dados da Denúncia</h3>
          <div class="input-group">
            <label>Decisão do MP</label>
            <select id="denuncia-decisao" onchange="updateDoc()">
              <option value="OFERECIMENTO">DEFERIR E OFERECER DENÚNCIA</option>
              <option value="INDEFERIMENTO">INDEFERIR DENÚNCIA (REJEIÇÃO)</option>
            </select>
          </div>
          <div class="input-row">
            <div class="input-group">
              <label>Acusado(a)</label>
              <input type="text" id="denuncia-acusado" placeholder="Nome do Acusado" oninput="updateDoc()">
            </div>
            <div class="input-group">
              <label>Passaporte (ID)</label>
              <input type="text" id="denuncia-passaporte" placeholder="ID" oninput="updateDoc()">
            </div>
          </div>
          <div class="input-group">
            <label>Capitulação Penal (Tipificação / Artigo)</label>
            <input type="text" id="denuncia-artigo" placeholder="Ex: Art. 155 do Código Penal (Furto)" oninput="updateDoc()">
          </div>
          <div class="input-group">
            <label>Exposição dos Fatos / Fundamentação</label>
            <textarea id="denuncia-fatos" rows="5" placeholder="Descreva sucintamente a conduta criminosa ou a fundamentação do indeferimento..." oninput="updateDoc()"></textarea>
          </div>
          <div class="input-group">
            <label>Promotor(a) de Justiça</label>
            <input type="text" id="denuncia-promotor" placeholder="Seu Nome" oninput="updateDoc()">
          </div>
        </div>
      </div>

      <!-- FORMULÁRIO GENÉRICO (Para Requisição, Promoção, Arquivamento, Manifestação, Parecer e Ofício) -->
      <div id="form-generico" class="form-container hidden">
        <div class="form-section">
          <h3>Preenchimento do Documento</h3>
          <div class="input-group">
            <label>Número do Processo / Procedimento</label>
            <input type="text" id="gen-proc" placeholder="Procedimento Nº 000/2026" oninput="updateDoc()">
          </div>
          <div class="input-group">
            <label>Destinatário / Requerido</label>
            <input type="text" id="gen-destinatario" placeholder="Ex: Ao Comandante do 1º BPM / Ao Juízo da 1ª Vara" oninput="updateDoc()">
          </div>
          <div class="input-group">
            <label>Teor do Documento / Fundamentação</label>
            <textarea id="gen-texto" rows="8" placeholder="Escreva o texto do documento ministerial..." oninput="updateDoc()"></textarea>
          </div>
          <div class="input-group">
            <label>Promotor(a) de Justiça</label>
            <input type="text" id="gen-promotor" placeholder="Seu Nome" oninput="updateDoc()">
          </div>
        </div>
      </div>

      <button class="btn-gerar" onclick="gerarImagem()">EMITIR DOCUMENTO (PNG)</button>
    </div>
  </div>

  <!-- ÁREA DE VISUALIZAÇÃO A4 -->
  <div class="viewer">
    <div class="a4-paper" id="relatorio-a4">
      <div class="doc-content" id="doc-output">
        <!-- O conteúdo HTML do documento será injetado dinamicamente via JS -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
